name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - '*'
    paths:
      - 'pyproject.toml'
      - 'titiler/**'
      - 'tests/**'
      - 'uv.lock'
      - 'Dockerfile'
      - '.github/workflows/ci.yml'
  pull_request:

permissions:
  contents: read

env:
  LATEST_PY_VERSION: '3.12'

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.9.*"
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        if: ${{ matrix.python-version == env.LATEST_PY_VERSION }}
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run tests
        run: uv run pytest --cov titiler.pycsw --cov-report term-missing

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: titiler-pycsw:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check it serves
        run: |
          docker run -d --name ci -p 8081:8081 titiler-pycsw:ci
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8081/healthz >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8081/healthz
          docker rm -f ci
