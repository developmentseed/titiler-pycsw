[project]
name = "titiler.pycsw"
description = "Connect a pycsw STAC API to TiTiler for dynamic tiling."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Development Seed"},
]
keywords = [
    "TiTiler",
    "pycsw",
    "STAC",
    "OGC API Records",
    "CSW",
    "Dynamic tile server",
]
classifiers = [
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "titiler.core>=0.21,<0.24",
    "titiler.mosaic>=0.21,<0.24",
    "cogeo-mosaic>=8.0,<9.0",
    "rio-tiler>=7.0,<8.0",
    "httpx>=0.27",
    "attrs>=23.0",
    "cachetools>=5.0",
    "pydantic>=2.4,<3.0",
    "pydantic-settings>=2.0",
    "geojson-pydantic>=1.0",
    "morecantile>=5.0",
]
dynamic = ["version"]

[project.optional-dependencies]
uvicorn = [
    "uvicorn",
]
lambda = [
    "mangum>=0.19",
]
test = [
    "pytest",
    "pytest-cov",
    "respx",
    "httpx",
]
dev = [
    "pre-commit",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/developmentseed/titiler-pycsw"
Issues = "https://github.com/developmentseed/titiler-pycsw/issues"
Source = "https://github.com/developmentseed/titiler-pycsw"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "titiler/pycsw/__init__.py"

[tool.hatch.build.targets.sdist]
only-include = ["titiler"]

[tool.hatch.build.targets.wheel]
only-include = ["titiler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "D1",  # pydocstyle missing docstrings
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions + mccabe
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line length handled by the formatter
    "B008",  # FastAPI dependencies are function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["D1"]

[tool.ruff.lint.isort]
known-first-party = ["titiler"]
