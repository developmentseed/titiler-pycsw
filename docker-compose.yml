services:
  pycsw-init:
    image: geopython/pycsw:latest
    user: root
    entrypoint: ["chown", "pycsw:pycsw", "/data"]
    volumes:
      - pycsw-data:/data

  pycsw:
    image: geopython/pycsw:latest
    ports:
      - "8000:8000"
    volumes:
      - ./stack/pycsw.yml:/etc/pycsw/pycsw.yml:ro
      - pycsw-data:/data
    environment:
      PYCSW_CONFIG: /etc/pycsw/pycsw.yml
    depends_on:
      pycsw-init:
        condition: service_completed_successfully

  titiler-pycsw:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      # from inside the compose network, pycsw is reachable by service name
      TITILER_PYCSW_STAC_API_URL: "http://pycsw:8000/stac"
      TITILER_PYCSW_DEFAULT_SORTBY: "-datetime"
      # GDAL tuning for remote COG reads
      GDAL_DISABLE_READDIR_ON_OPEN: "EMPTY_DIR"
      GDAL_HTTP_MULTIPLEX: "YES"
      GDAL_HTTP_VERSION: "2"
      VSI_CACHE: "TRUE"
    depends_on:
      - pycsw

volumes:
  pycsw-data:
